name: bitcoin_wallet_ui — end to end in Basecamp, with Kyoto as the chain authority, on regtest
project_name: logos-bitcoin-wallet-ui-e2e-kyoto

intro: |
  The full-Basecamp e2e (see basecamp-e2e) with Kyoto deciding the chain: the wallet core's
  `regtest.json` lists the chain's three filter-serving nodes as Kyoto's peers, with a quorum of 2,
  and one electrs that only cross-checks Kyoto's headers and estimates fees (`checkOnly`). The core
  takes its regtest sources from that file, not from the node module's own peers. Kyoto has no
  mempool view, so a payment shows once it is in a block; a send goes out through one of Kyoto's
  peers. Open, receive, send and confirm, then a reorg the peers follow together.

  Then two restores from the written-down phrase. In a fresh user dir the keys app is given no
  day, so the wallet asks for its birthday, set in the wallet app. In a third, Blockstream's
  electrs (`chain.sh esplora`) is the only server, and a `regtest.json` checkpoint sits just above
  the first two payments: a wallet whose birthday is above it is opened with open_wallet's own
  birthday (the app takes no block height, and a regtest day names none), and Esplora reports those
  payments below the chain's start, shown unchecked, apart from the balance, with a banner of their
  own. The banner's earlier birthday lets Kyoto check them. That section needs Esplora on the chain's
  machine, so it runs on Linux and macOS only.

sections:
  - title: "Build"
    steps:
      - title: "Basecamp's inspector bundle, the modules and apps (portable variants), and the chain script"
        platform: [linux, macos]
        run: |
          set -eu
          mkdir -p e2e/build
          b() { nix build "$2" --no-write-lock-file -o "e2e/build/$1"; }
          b basecamp 'github:logos-co/logos-basecamp/0b5cd2ee6c6dd83c6a5022fbb30e1778e6a61da9#bin-bundle-dir-inspector'
          b keystore 'github:logos-co/logos-evm-keystore-module/1f3d62f306f0e4dc7e5d96d478f9770ab3713ce6#install-portable'
          b manager 'github:logos-co/logos-signer-manager-module/80bc40ccbe6c689caadc736b3db2136bfbde1818#install-portable'
          b keys 'github:logos-co/logos-evm-keystore-ui/f3fdc18f382887905c761312098203506e357c75#install-portable'
          b signer 'github:logos-co/logos-evm-signer-ui/05cf10b2039dd33da1134736280952274b3fc385#install-portable'
          b backend 'github:logos-co/logos-bitcoin-wallet-backend/b38ffc607d4e27bb9b53b01b50c77b90b37f4f41#install-portable'
          b core 'github:logos-co/logos-bitcoin-wallet-core-module/825a459aa2bbd4bb1168339ea4ab9ad682ba1cca#install-portable'
          b chain 'github:logos-co/logos-bitcoin-wallet-core-module/825a459aa2bbd4bb1168339ea4ab9ad682ba1cca#regtest-chain'
          b node 'github:logos-co/logos-bitcoin-node-module/4b02811673d0836a42090330345c2cf1a4bf2eba#install-portable'
          b esplora 'github:logos-co/logos-bitcoin-wallet-core-module/825a459aa2bbd4bb1168339ea4ab9ad682ba1cca#esplora-electrs'
          b wallet "git+file://${E2E_REPO:?run this spec through doctests/run.sh}#install-portable"
          ls e2e/build
        expect_contains: ["basecamp", "keystore", "manager", "keys", "signer", "backend", "core", "chain", "node", "esplora", "wallet"]
      - title: "On Windows, the same builds cross-built and staged under e2e/build; the chain runs on its host"
        platform: [windows]
        run: |
          set -eu
          ls e2e/build
          echo "chain: ${E2E_CHAIN_URL:?E2E_CHAIN_URL names the chainctl of the chain host}"
        expect_contains: ["basecamp", "keystore", "manager", "keys", "signer", "backend", "core", "node", "wallet", "chain: http"]

  - title: "A regtest chain and the test's passwords"
    platform: [linux, macos, windows]
    steps:
      - title: "Three bitcoind serving block filters and two electrs, from the wallet core's chain script, off the default ports"
        run: python3 "$E2E_REPO/doctests/e2e/drive.py" prepare-chain
        expect_contains: ["PASS a fresh regtest chain"]
      - title: "Two test passwords, generated and kept in the scratch dir"
        run: python3 "$E2E_REPO/doctests/e2e/drive.py" secrets
        expect_contains: ["PASS two test passwords generated"]

  - title: "Basecamp, with its own HOME and user dir"
    platform: [linux, macos, windows]
    steps:
      - title: "Lay out user A, with the wallet core's regtest.json for this authority"
        run: python3 "$E2E_REPO/doctests/e2e/drive.py" layout userA kyoto
        expect_contains: ["PASS laid out userA for kyoto"]
      - title: "Launch Basecamp headless"
        run: python3 "$E2E_REPO/doctests/e2e/drive.py" launch userA
        expect_contains: ["PASS Basecamp is up for userA"]

  - title: "Open: a new wallet, created in the keys app"
    platform: [linux, macos, windows]
    steps:
      - title: "Open, create and approve; the wallet syncs, and the sync line names its authority"
        run: python3 "$E2E_REPO/doctests/e2e/drive.py" open-create
        expect_contains: ["PASS created and opened in the keys app", "PHASE open-create OK"]

  - title: "Receive"
    platform: [linux, macos, windows]
    steps:
      - title: "1 BTC to the receive address confirms once mined; a block mined to the wallet is immature for 100 blocks"
        run: python3 "$E2E_REPO/doctests/e2e/drive.py" receive
        expect_contains: ["PASS Activity lists +1 BTC, 1 confirmation", "PASS immature:", "PHASE receive OK"]

  - title: "Send"
    platform: [linux, macos, windows]
    steps:
      - title: "Approve in the signer app; it reaches the chain's main node and confirms"
        run: python3 "$E2E_REPO/doctests/e2e/drive.py" send
        expect_contains: ["PASS the send reached the main node's mempool", "PASS Activity shows the send confirmed", "PHASE send OK"]

  - title: "Reorg"
    platform: [linux, macos, windows]
    text: |
      A payment confirmed in the tip block, then the fork node, one of Kyoto's peers, replaces that
      block with a longer branch. The peers follow it together: the core reports the move, Activity
      says the payment was re-anchored, and neither the cross-checked server nor Kyoto raises an
      alert. An alert from before the reorg is noted and dismissed first.
    steps:
      - title: "Re-anchored, in Activity and its details, with no alert"
        run: python3 "$E2E_REPO/doctests/e2e/drive.py" reorg
        expect_contains: ["PASS the payment confirms again in the new block", "PASS Activity: re-anchored at height", "PASS details: Moved to a new block", "PASS no alert during the reorg", "PHASE reorg OK"]

  - title: "Close, then restore with no day in the keys app"
    platform: [linux, macos, windows]
    text: |
      The wallet closes and Basecamp stops. In a second user dir the keys app restores the wallet
      from the written-down phrase and is given no day, so the core has no birthday: Home asks for
      one, the person sets it in the wallet app, and the wallet scans again from it under Kyoto.
      The balance and the history must match the first user dir's.
    steps:
      - title: "Note the balance and history, then close the wallet"
        run: python3 "$E2E_REPO/doctests/e2e/drive.py" close
        expect_contains: ["PHASE close OK"]
      - title: "Stop Basecamp by PID"
        run: python3 "$E2E_REPO/doctests/e2e/drive.py" stop
        expect_contains: ["PASS Basecamp stopped"]
      - title: "Lay out user B and launch"
        run: |
          python3 "$E2E_REPO/doctests/e2e/drive.py" layout userB
          python3 "$E2E_REPO/doctests/e2e/drive.py" launch userB
        expect_contains: ["PASS laid out userB", "PASS Basecamp is up for userB"]
      - title: "Home asks for the birthday; set in the wallet app, it scans again, and the balance and history match"
        run: python3 "$E2E_REPO/doctests/e2e/drive.py" restore-birthday
        expect_contains: ["PASS restored in the keys app with no day given", "PASS Home asks", "PASS birthday", "PASS the restored balance matches", "PHASE restore-birthday OK"]

  - title: "Unchecked: Esplora reports payments below the chain's start"
    platform: [linux, macos]
    text: |
      A third user dir, with Esplora as the only server and a checkpoint just above the first two
      payments. Restored with a birthday above it, the wallet's chain starts there; Esplora reports
      those two payments below it, where nothing can check them. They read "Reported by esplora-0,
      not checked" in Activity, show apart from the confirmed balance on Home, and the
      unchecked_anchor alert has a banner of its own. Its earlier birthday starts the chain at
      genesis, Kyoto checks them, and the balance and history match the first user dir's.
    steps:
      - title: "Stop Basecamp by PID"
        run: python3 "$E2E_REPO/doctests/e2e/drive.py" stop
        expect_contains: ["PASS Basecamp stopped"]
      - title: "Start Esplora on the chain, lay out user C with it and the checkpoint, and launch"
        run: |
          python3 "$E2E_REPO/doctests/e2e/drive.py" layout userC kyoto-esplora
          python3 "$E2E_REPO/doctests/e2e/drive.py" launch userC
        expect_contains: ["esplora: http", "PASS laid out userC for kyoto-esplora", "PASS Basecamp is up for userC"]
      - title: "Unchecked, apart from the balance, with a banner; an earlier birthday checks them"
        run: python3 "$E2E_REPO/doctests/e2e/drive.py" unchecked
        expect_contains: ["PASS the wallet's chain starts at the checkpoint", "reported, not checked, apart from the balance", "PASS the banner:", "reads Reported by esplora-0, not checked", "PASS an earlier birthday from the banner: nothing unchecked any more", "PASS the chain starts at genesis now", "PASS the checked balance matches", "PHASE unchecked OK"]

  - title: "Stop"
    platform: [linux, macos, windows]
    steps:
      - title: "Stop Basecamp and the chain by PID"
        run: python3 "$E2E_REPO/doctests/e2e/drive.py" cleanup
        expect_contains: ["chain stopped"]
