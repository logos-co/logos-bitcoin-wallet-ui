name: bitcoin_wallet_ui — the real backend, wallet core and node module, up to the keys app, in Basecamp
project_name: logos-bitcoin-wallet-ui

# The real modules behind the app; nothing can approve an open here, so the run stops at the
# handle for the keys app. HOME is the run's own.

intro: |
  The app against the modules it ships with: bitcoin_wallet_backend 597ad2c,
  bitcoin_wallet_core_module 7a13513, bitcoin_node_module 7462bce, signer_manager_module d2548c6
  and keystore_module 1f3d62f. The node module's own sources for signet, a server of your own
  added and given History through the app, a TLS server of your own whose self-signed certificate
  the node module's probe reads and the app pins and unpins, a Kyoto peer of your own that replaces
  the node module's curated list and is dropped again, and an open that reaches the signer
  manager and comes back as the core's handle for the keys app, then is withdrawn. No keys app is
  installed and the signer manager has no custodian here, so nothing can approve the open, and
  sends are not reached.

sections:
  - title: "Build Basecamp, the app, and the real module chain"
    steps:
      - title: "Build Basecamp's standalone host, the app, and the modules behind it"
        run: |
          set -eu
          nix build 'github:logos-co/logos-basecamp#app-standalone' --no-write-lock-file -o result-basecamp
          nix build 'github:logos-co/logos-qt-mcp' --no-write-lock-file -o result-mcp
          nix build 'github:logos-co/logos-bitcoin-wallet-backend/597ad2c9b69621d0fa4ff15f44d8de9953ab003f#install' -o result-real-backend
          nix build 'github:logos-co/logos-bitcoin-wallet-core-module/7a135139e68154b76765513bd6bfbc7a805de5e5#install' -o result-real-core
          nix build 'github:logos-co/logos-bitcoin-node-module/7462bce96676bad4be296155117bd6ea6c643a4d#install' -o result-real-node
          nix build 'github:logos-co/logos-signer-manager-module/d2548c674b88d29769a366e1c818d614b07d6f77#install' -o result-real-manager
          nix build 'github:logos-co/logos-evm-keystore-module/1f3d62f306f0e4dc7e5d96d478f9770ab3713ce6#install' -o result-real-keystore
          nix build "git+file://${E2E_REPO:?run this spec through doctests/run.sh}#install" -o result-wallet
          # Its own tree, user dir and HOME: run.sh runs every spec in one output directory.
          mkdir -p real/tree/modules real/home
          for r in backend core node manager keystore; do cp -rL "result-real-$r"/modules/* real/tree/modules/; done
          chmod -R u+w real/tree
          ls real/tree/modules
        expect_contains: ["bitcoin_wallet_backend", "bitcoin_wallet_core_module", "bitcoin_node_module", "signer_manager_module", "keystore_module"]

  - title: "A TLS server of your own"
    steps:
      - title: "A self-signed certificate on 127.0.0.1:50902, for the node module's probe to read"
        run: |
          set -eu
          mkdir -p real/tls
          openssl req -x509 -newkey rsa:2048 -nodes -keyout real/tls/key.pem -out real/tls/cert.pem -days 30 -subj "/CN=electrs.test" 2>/dev/null
          python3 "${E2E_REPO:?run this spec through doctests/run.sh}/doctests/e2e/tls_server.py" real/tls 50902
          echo "SHA-256 $(openssl x509 -in real/tls/cert.pem -outform der | shasum -a 256 | cut -c1-64)"
        expect_contains: ["SHA-256 "]

  - title: "Drive the app"
    steps:
      - title: "Sources through the node module, then an open up to the keys app, withdrawn"
        ui_test:
          launch: "env HOME=$PWD/real/home QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QT_FORCE_STDERR_LOGGING=1 QML_INSPECTOR_PORT=3768 LOGOS_NO_SCHEME_REGISTER=1 ./result-basecamp/bin/LogosBasecamp --module ./result-wallet --modules-dir ./real/tree/modules --user-dir ./real/userdir"
          qt_mcp: "result-mcp"
          launch_timeout: 300
          tests:
            - name: "With nothing open the app offers to open a wallet"
              action: expect_property
              find_value: "statusLine"
              property: "text"
              value: "No wallet open"
              timeout: 90000
            - name: "Choose signet"
              action: call_method
              find_value: "bitcoinWalletRoot"
              method: "selectNetwork"
              args: ["signet"]
            - name: "The backend switched networks"
              action: expect_property
              find_value: "networkChip"
              property: "text"
              value: "signet"
              timeout: 20000
            - name: "Open Sources"
              action: click_object
              find_value: "networkSettingsButton"
            - name: "The sheet opens"
              action: expect_property
              find_value: "networkSheet"
              property: "opened"
              value: true
              timeout: 10000
            - name: "The backend has filled the node module's defaults for signet, and the app read them"
              action: expect_property
              find_value: "bitcoinWalletRoot"
              property: "sourcesConfigured"
              value: true
              timeout: 60000
            - name: "Kyoto is on by default, so something defines the chain"
              action: expect_property
              find_value: "noChainNotice"
              property: "visible"
              value: false
              timeout: 5000
              screenshot: "real-sources.png"
            - name: "Expand advanced settings"
              action: call_method
              find_value: "advancedSourcesButton"
              method: "clicked"
              args: []
            - name: "Type a server of your own"
              action: set_text
              find_by: "objectName"
              find_value: "addSourceAddress"
              value: "192.168.1.20:50001"
            - name: "Name it"
              action: set_text
              find_by: "objectName"
              find_value: "addSourceName"
              value: "Home node"
            - name: "Add it"
              action: click_object
              find_value: "addSourceButton"
            - name: "The node module lists it, on your network"
              action: expect_property
              find_value: "lanBadge_192.168.1.20"
              property: "visible"
              value: true
              timeout: 20000
            - name: "Expand the server details"
              action: call_method
              find_value: "sourceDetails_192.168.1.20"
              method: "clicked"
              args: []
            - name: "Turn on its History"
              action: call_method
              find_value: "historySwitch_192.168.1.20"
              method: "clicked"
              args: []
            - name: "The node module took it"
              action: expect_property
              find_value: "historySwitch_192.168.1.20"
              property: "checked"
              value: true
              timeout: 20000
            - name: "Remove it again"
              action: call_method
              find_value: "removeSource_192.168.1.20"
              method: "clicked"
              args: []
            - name: "Nothing was refused"
              action: expect_property
              find_value: "sourcesNote"
              property: "visible"
              value: false
              timeout: 10000
            - name: "Add your TLS server"
              action: set_text
              find_by: "objectName"
              find_value: "addSourceAddress"
              value: "ssl://127.0.0.1:50902"
            - name: "Name it"
              action: set_text
              find_by: "objectName"
              find_value: "addSourceName"
              value: "TLS test"
            - name: "Add it: the app asks the node module to probe it"
              action: click_object
              find_value: "addSourceButton"
            - name: "Expand TLS server details"
              action: call_method
              find_value: "sourceDetails_127.0.0.1"
              method: "clicked"
              args: []
            - name: "The probe read its self-signed certificate, which nothing trusts yet"
              action: expect_property
              find_value: "trustCert_127.0.0.1"
              property: "visible"
              value: true
              timeout: 30000
              screenshot: "real-certificate.png"
            - name: "Trust this certificate: the node module pins it"
              action: call_method
              find_value: "trustCert_127.0.0.1"
              method: "clicked"
              args: []
            - name: "It is pinned"
              action: expect_property
              find_value: "pinnedBadge_127.0.0.1"
              property: "visible"
              value: true
              timeout: 20000
            - name: "...and the row shows the pin"
              action: expect_property
              find_value: "certPin_127.0.0.1"
              property: "visible"
              value: true
              timeout: 5000
            - name: "Remove the pin"
              action: call_method
              find_value: "removePin_127.0.0.1"
              method: "clicked"
              args: []
            - name: "It is no longer pinned"
              action: expect_property
              find_value: "pinnedBadge_127.0.0.1"
              property: "visible"
              value: false
              timeout: 20000
            - name: "Remove the TLS server"
              action: call_method
              find_value: "removeSource_127.0.0.1"
              method: "clicked"
              args: []
            - name: "It is gone"
              action: expect_property
              find_value: "sourcesNote"
              property: "visible"
              value: false
              timeout: 10000
            - name: "Expand Bitcoin peer details"
              action: call_method
              find_value: "sourceDetails_kyoto"
              method: "clicked"
              args: []
            - name: "Under Kyoto, the node module's peer book for signet: its signed list, nothing learned yet"
              action: expect_property
              find_value: "curatedLine"
              property: "text"
              value: "11 known peers: 11 from the signed list, 0 learned · 0 worked in the last 30 days"
              timeout: 20000
            - name: "...the signed list provisional and test-signed"
              action: expect_property
              find_value: "signedListNote"
              property: "text"
              value: "The signed list is provisional, and signed with a test key, not a release."
            - name: "A peer of your own"
              action: set_text
              find_by: "objectName"
              find_value: "ownPeerField"
              value: "192.168.1.20:38333"
            - name: "Add it: the backend relays it to the node module, and it replaces the curated list"
              action: call_method
              find_value: "addOwnPeerButton"
              method: "clicked"
              args: []
            - name: "The node module lists it"
              action: expect_property
              find_value: "ownPeer_192.168.1.20:38333"
              property: "visible"
              value: true
              timeout: 20000
            - name: "On your network, Kyoto dials it directly"
              action: expect_property
              find_value: "ownPeersRoute"
              property: "text"
              value: "Kyoto reaches them directly, on your network."
              timeout: 5000
              screenshot: "real-own-peers.png"
            - name: "Use the curated list again"
              action: call_method
              find_value: "useCuratedButton"
              method: "clicked"
              args: []
            - name: "Back to the curated list"
              action: expect_property
              find_value: "useCuratedButton"
              property: "visible"
              value: false
              timeout: 20000
            - name: "Nothing was refused on the way"
              action: expect_property
              find_value: "ownPeersNote"
              property: "visible"
              value: false
            - name: "Close the sheet"
              action: call_method
              find_value: "bitcoinWalletRoot"
              method: "closeSheets"
              args: []
            - name: "The sheet is closed"
              action: expect_property
              find_value: "networkSheet"
              property: "visible"
              value: false
              timeout: 10000
            - name: "Open a wallet is enabled"
              action: expect_property
              find_value: "openWalletButton"
              property: "enabled"
              value: true
              timeout: 10000
            - name: "Open a wallet"
              action: click_object
              find_value: "openWalletButton"
            - name: "The wallet core asked the signer manager, and waits for the person"
              action: expect_property
              find_value: "bitcoinWalletRoot"
              property: "walletState"
              value: "awaiting_open"
              timeout: 30000
            - name: "The app waits for the keys app"
              action: expect_property
              find_value: "keysWaitTitle"
              property: "text"
              value: "Waiting for the keys app"
              timeout: 10000
            - name: "It raised keystore.accounts.open with the core's handle; no keys app is installed"
              action: expect_property
              find_value: "keysNote"
              property: "text"
              value: "The keys app is not installed here. Install it, open it, and approve the request under Requests from apps."
              timeout: 20000
              screenshot: "real-waiting-keys.png"
            - name: "Cancel"
              action: click_object
              find_value: "cancelOpenButton"
            - name: "The core withdrew the open"
              action: expect_property
              find_value: "bitcoinWalletRoot"
              property: "walletState"
              value: "no_wallet"
              timeout: 30000
            - name: "...and the app offers to open one again, with no error"
              action: expect_property
              find_value: "openForm"
              property: "visible"
              value: true
              timeout: 10000
            - name: "No error was said"
              action: expect_property
              find_value: "errorNotice"
              property: "visible"
              value: false
              timeout: 5000
              screenshot: "real-withdrawn.png"

  - title: "Stop the TLS server"
    steps:
      - title: "By its PID"
        run: kill "$(cat real/tls/server.pid)" && echo stopped
        expect_contains: ["stopped"]
