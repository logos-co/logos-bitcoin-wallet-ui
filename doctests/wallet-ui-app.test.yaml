name: bitcoin_wallet_ui — open a wallet through the keys app, send through the signer app, settle every outcome, in Basecamp
project_name: logos-bitcoin-wallet-ui

# Waits poll a property: a text match also finds hidden items. Rows below the fold are clicked with
# call_method. Offscreen with the software renderer: no window, no GPU, screenshots still work.

intro: |
  The whole app in one headless run, in Basecamp's standalone mode: a wallet is opened through the
  keys app's intent (the first attempt withdrawn), the sources are set before it opens and locked
  while it is open, a fresh BIP21 address is handed out, and sends go through the signer app's
  intent to each of their outcomes: nobody acknowledging within 60 s and asking again, a cancel, a
  rejection, an unknown outcome that is forgotten, and a payment that goes out and is sped up. The
  sync line never claims "Synchronized" once no source agrees with the wallet's chain, nor "No
  source agrees" before its sources first answered. Opens show the first unused address, New
  address at the gap limit says why it gives no new one, and the fee presets need an estimate.

  The backend is a stand-in, doctests/fixture-backend: the real bitcoin_wallet_backend's contract
  (its trait, copied from logos-bitcoin-wallet-backend 70172f8) with a script behind it, and no
  wallet core, keystore, chain or network. The signer manager is one too, doctests/fixture-manager:
  its `accounts` answers a keystore wallet on each chain and a Keycard account with no card
  inserted, which the account picker names by its seed wallet and still opens: only sending needs
  the card. The keys app and the signer app are not installed, so
  Basecamp answers both intents `unavailable`, and the stand-in plays the person: it never approves
  the first open of a run, approves the next after 4 s, and picks a send's fate by its amount:
  0.0002 BTC is rejected, 0.0003 BTC expires unacknowledged, 0.0004 BTC goes out with an unknown
  outcome, 0.0005 BTC leaves change too small to spend (added to the fee when asked), and the first
  payment sent makes the history server report a confirmation on another chain. A wallet opens
  without a birthday (one after its first payment, 2026-05-31, is refused), a reorg re-anchors the
  transfer to yourself 5 s after the first open is ready, and with Kyoto in use it is the authority
  and names a chain the wallet refuses. A TLS server of your own is probed and pinned, a peer of
  your own replaces Kyoto's curated list, and a switch asked for while the wallet closes waits for
  the close, and an open asked for meanwhile is refused until the switch applies. Under Kyoto on signet a
  payment Esplora reports below the chain's start shows unchecked, apart from the balance, until an
  earlier birthday checks it; on testnet4 one peer decides the chain, and the sources say so. A coin
  past the 20-address gap limit shows apart and spendable, a small send spends it and its review
  says so, and a gap limit raised to 30 (asked first) rescans and takes it into the balance.

sections:
  - title: "Build Basecamp, the app, and the stand-in backend"
    steps:
      - title: "Build Basecamp's standalone host, the app, and the stand-ins it depends on"
        run: |
          set -eu
          nix build 'github:logos-co/logos-basecamp#app-standalone' --no-write-lock-file -o result-basecamp
          nix build 'github:logos-co/logos-qt-mcp' --no-write-lock-file -o result-mcp
          nix build "git+file://${E2E_REPO:?run this spec through doctests/run.sh}?dir=doctests/fixture-backend#install" -o result-backend
          nix build "git+file://${E2E_REPO:?run this spec through doctests/run.sh}?dir=doctests/fixture-manager#install" -o result-manager
          nix build "git+file://${E2E_REPO:?run this spec through doctests/run.sh}#install" -o result-wallet
          mkdir -p tree/modules
          cp -rL result-backend/modules/* result-manager/modules/* tree/modules/
          chmod -R u+w tree
          ls tree/modules result-wallet/plugins
        expect_contains: ["bitcoin_wallet_backend", "signer_manager_module", "bitcoin_wallet_ui"]

  - title: "Drive the wallet"
    steps:
      - title: "Open, receive, send to every outcome, speed up, close"
        ui_test:
          # LOGOS_NO_SCHEME_REGISTER: a test run leaves the machine's logos:// handler alone.
          launch: "env QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QT_FORCE_STDERR_LOGGING=1 QML_INSPECTOR_PORT=3768 LOGOS_NO_SCHEME_REGISTER=1 ./result-basecamp/bin/LogosBasecamp --module ./result-wallet --modules-dir ./tree/modules --user-dir ./userdir"
          qt_mcp: "result-mcp"
          launch_timeout: 300
          tests:
            - name: "With nothing open the app offers to open a wallet"
              action: expect_property
              find_value: "statusLine"
              property: "text"
              value: "No wallet open"
              timeout: 60000
            - name: "Choose signet"
              action: call_method
              find_value: "bitcoinWalletRoot"
              method: "selectNetwork"
              args: ["signet"]
            - name: "The app is on signet"
              action: expect_property
              find_value: "networkChip"
              property: "text"
              value: "signet"
              timeout: 15000
              screenshot: "wallet-open-page.png"

            - name: "Open Sources before any wallet is open"
              action: click_object
              find_value: "networkSettingsButton"
            - name: "The sheet opens"
              action: expect_property
              find_value: "networkSheet"
              property: "opened"
              value: true
              timeout: 10000
            - name: "The sources are read"
              action: expect_property
              find_value: "bitcoinWalletRoot"
              property: "sourcesConfigured"
              value: true
              timeout: 30000
            - name: "Expand advanced settings"
              action: call_method
              find_value: "advancedSourcesButton"
              method: "clicked"
              args: []
            - name: "With Kyoto off, both servers in use are one operator's, and the app says so"
              action: expect_property
              find_value: "oneOperatorNotice"
              property: "visible"
              value: true
              timeout: 10000
            - name: "Type a server of your own"
              action: set_text
              find_by: "objectName"
              find_value: "addSourceAddress"
              value: "192.168.1.20:50001"
            - name: "Name it"
              action: set_text
              find_by: "objectName"
              find_value: "addSourceName"
              value: "Home node"
            - name: "Add it"
              action: call_method
              find_value: "addSourceButton"
              method: "clicked"
              args: []
            - name: "It is listed, on your network"
              action: expect_property
              find_value: "lanBadge_192.168.1.20"
              property: "visible"
              value: true
              timeout: 15000
            - name: "Plain text to it is marked"
              action: expect_property
              find_value: "notEncryptedBadge_192.168.1.20"
              property: "visible"
              value: true
              timeout: 10000
            - name: "A second operator now decides the chain too"
              action: expect_property
              find_value: "oneOperatorNotice"
              property: "visible"
              value: false
              timeout: 10000
            - name: "Scroll the sheet down to the servers, as a person would"
              action: call_method
              find_value: "bitcoinWalletRoot"
              method: "scrollSources"
              args: ["end"]
            - name: "Expand Electrum details"
              action: call_method
              find_value: "sourceDetails_electrum.example"
              method: "clicked"
              args: []
            - name: "Turn on History for the Electrum server"
              action: call_method
              find_value: "historySwitch_electrum.example"
              method: "clicked"
              args: []
            - name: "History is on"
              action: expect_property
              find_value: "historySwitch_electrum.example"
              property: "checked"
              value: true
              timeout: 10000
            - name: "Switch its Tor off"
              action: call_method
              find_value: "torSwitch_electrum.example"
              method: "clicked"
              args: []
            - name: "The row is marked"
              action: expect_property
              find_value: "withoutTorBadge_electrum.example"
              property: "visible"
              value: true
              timeout: 10000
            - name: "The public-service disclosure remains visible"
              action: expect_property
              find_value: "publicPrivacyNotice"
              property: "visible"
              value: true
              timeout: 10000
            - name: "Switch Tor back on, which needs no asking"
              action: call_method
              find_value: "torSwitch_electrum.example"
              method: "clicked"
              args: []
            - name: "Nothing is reached without Tor"
              action: expect_property
              find_value: "withoutTorBadge_electrum.example"
              property: "visible"
              value: false
              timeout: 10000
            - name: "Expand the local server details"
              action: call_method
              find_value: "sourceDetails_192.168.1.20"
              method: "clicked"
              args: []
            - name: "Remove your own server again"
              action: call_method
              find_value: "removeSource_192.168.1.20"
              method: "clicked"
              args: []
            - name: "One operator again"
              action: expect_property
              find_value: "oneOperatorNotice"
              property: "visible"
              value: true
              timeout: 10000
            - name: "Add a TLS server of your own"
              action: set_text
              find_by: "objectName"
              find_value: "addSourceAddress"
              value: "ssl://electrs.lan:50002"
            - name: "Name it"
              action: set_text
              find_by: "objectName"
              find_value: "addSourceName"
              value: "TLS node"
            - name: "Add it: the app probes it"
              action: call_method
              find_value: "addSourceButton"
              method: "clicked"
              args: []
            - name: "Its self-signed certificate shows before anything trusts it"
              action: expect_property
              find_value: "certDetails_electrs.lan"
              property: "text"
              value: "Subject CN=electrs.lan, issued by CN=electrs.lan\nValid 2026-10-11 to 2126-09-17\nSHA-256 C4:EC:62:C0:92:EF:FE:42:C4:EC:62:C0:92:EF:FE:42:C4:EC:62:C0:92:EF:FE:42:C4:EC:62:C0:92:EF:FE:42"
              timeout: 20000
            - name: "Scroll down to its row"
              action: call_method
              find_value: "bitcoinWalletRoot"
              method: "scrollSources"
              args: ["end"]
            - name: "Expand certificate details"
              action: call_method
              find_value: "sourceDetails_electrs.lan"
              method: "clicked"
              args: []
            - name: "...in its row"
              action: expect_property
              find_value: "certDetails_electrs.lan"
              property: "visible"
              value: true
              screenshot: "wallet-certificate.png"
            - name: "Trust this certificate"
              action: call_method
              find_value: "trustCert_electrs.lan"
              method: "clicked"
              args: []
            - name: "It is pinned"
              action: expect_property
              find_value: "pinnedBadge_electrs.lan"
              property: "visible"
              value: true
              timeout: 15000
            - name: "...and the row shows the pin"
              action: expect_property
              find_value: "certPin_electrs.lan"
              property: "text"
              value: "Pinned certificate, SHA-256 C4:EC:62:C0:92:EF:FE:42:C4:EC:62:C0:92:EF:FE:42:C4:EC:62:C0:92:EF:FE:42:C4:EC:62:C0:92:EF:FE:42"
              timeout: 5000
            - name: "Remove the pin"
              action: call_method
              find_value: "removePin_electrs.lan"
              method: "clicked"
              args: []
            - name: "It is no longer pinned"
              action: expect_property
              find_value: "pinnedBadge_electrs.lan"
              property: "visible"
              value: false
              timeout: 15000
            - name: "Remove the TLS server again"
              action: call_method
              find_value: "removeSource_electrs.lan"
              method: "clicked"
              args: []
            - name: "One operator again, the example's"
              action: expect_property
              find_value: "oneOperatorNotice"
              property: "visible"
              value: true
              timeout: 10000
            - name: "Scroll back up to Kyoto's row"
              action: call_method
              find_value: "bitcoinWalletRoot"
              method: "scrollSources"
              args: ["top"]
            # Set, not toggled: Kyoto's details may already be open from an earlier pass over the sheet.
            - name: "Expand Bitcoin peer details"
              action: set_property
              find_value: "bitcoinWalletRoot"
              property: "expandedSources"
              value: ["kyoto"]
            - name: "Under Kyoto, the install's peer book: the signed list, peers learned, and how many worked lately"
              action: expect_property
              find_value: "curatedLine"
              property: "text"
              value: "14 known peers: 11 from the signed list, 3 learned · 6 worked in the last 30 days"
              timeout: 15000
            - name: "...and that the signed list is provisional and test-signed"
              action: expect_property
              find_value: "signedListNote"
              property: "text"
              value: "The signed list is provisional, and signed with a test key, not a release."
            - name: "A peer of your own"
              action: set_text
              find_by: "objectName"
              find_value: "ownPeerField"
              value: "192.168.1.20:38333"
            - name: "Add it: it replaces the curated list"
              action: call_method
              find_value: "addOwnPeerButton"
              method: "clicked"
              args: []
            - name: "It is listed"
              action: expect_property
              find_value: "ownPeer_192.168.1.20:38333"
              property: "visible"
              value: true
              timeout: 10000
            - name: "On your network, Kyoto reaches it directly"
              action: expect_property
              find_value: "ownPeersRoute"
              property: "text"
              value: "Kyoto reaches them directly, on your network."
              timeout: 5000
              screenshot: "wallet-own-peers.png"
            - name: "Use the curated list again"
              action: call_method
              find_value: "useCuratedButton"
              method: "clicked"
              args: []
            - name: "Back to the curated list"
              action: expect_property
              find_value: "useCuratedButton"
              property: "visible"
              value: false
              timeout: 10000
            - name: "Close the sheet"
              action: call_method
              find_value: "bitcoinWalletRoot"
              method: "closeSheets"
              args: []
            - name: "The sheet is closed"
              action: expect_property
              find_value: "networkSheet"
              property: "visible"
              value: false
              timeout: 10000

            - name: "The signer's accounts on signet are listed"
              action: expect_property
              find_value: "accountPicker"
              property: "enabled"
              value: true
              timeout: 20000
            - name: "Pick the keystore wallet"
              action: set_property
              find_value: "accountPicker"
              property: "currentIndex"
              value: 0
            - name: "...as a person choosing it would"
              action: call_method
              find_value: "accountPicker"
              method: "activated"
              args: [0]
            - name: "It is selected"
              action: expect_property
              find_value: "bitcoinWalletRoot"
              property: "selectedAccountId"
              value: "g_fixture_keystore"
              timeout: 5000
            - name: "Open a wallet is enabled"
              action: expect_property
              find_value: "openWalletButton"
              property: "enabled"
              value: true
              timeout: 10000
            - name: "Open a wallet"
              action: click_object
              find_value: "openWalletButton"
            - name: "The app waits for the keys app, under the open's handle"
              action: expect_property
              find_value: "bitcoinWalletRoot"
              property: "openHandle"
              value: "sma_fixture1"
              timeout: 10000
            - name: "...and says so"
              action: expect_property
              find_value: "keysWaitTitle"
              property: "text"
              value: "Waiting for the keys app"
              timeout: 5000
            - name: "No keys app is installed: Basecamp answers the intent unavailable, and the app says what to do"
              action: expect_property
              find_value: "keysNote"
              property: "text"
              value: "The keys app is not installed here. Install it, open it, and approve the request under Requests from apps."
              timeout: 15000
              screenshot: "wallet-waiting-keys.png"
            - name: "Cancel"
              action: click_object
              find_value: "cancelOpenButton"
            - name: "The open is withdrawn"
              action: expect_property
              find_value: "openForm"
              property: "visible"
              value: true
              timeout: 15000
            - name: "...and no wallet is open"
              action: expect_property
              find_value: "bitcoinWalletRoot"
              property: "walletState"
              value: "no_wallet"
              timeout: 5000
            - name: "Open a wallet is enabled again once the withdrawal settled"
              action: expect_property
              find_value: "openWalletButton"
              property: "enabled"
              value: true
              timeout: 10000
            - name: "Open again; this time the person approves in the keys app"
              action: click_object
              find_value: "openWalletButton"
            - name: "The wallet opens"
              action: expect_property
              find_value: "bitcoinWalletRoot"
              property: "walletOpen"
              value: true
              timeout: 30000
            - name: "Until its sources first answer, last session's chain shows as connecting, never as no source agreeing"
              action: expect_property
              find_value: "syncLine"
              property: "text"
              value: "Connecting to the chain's sources… · last known block 290,123"
              timeout: 4000
              screenshot: "wallet-first-answer.png"
            - name: "...on signet"
              action: expect_property
              find_value: "statusLine"
              property: "text"
              value: "Open: Fixture wallet · signet"
              timeout: 10000
            - name: "It syncs to the chain's tip, with sources agreeing and a fresh tip"
              action: expect_property
              find_value: "syncLine"
              property: "text"
              value: "Synchronized · block 290,123, tip 4 min old · Servers' headers"
              timeout: 30000
            - name: "Restored without a birthday: Home asks for one"
              action: expect_property
              find_value: "needsBirthdayHomeNotice"
              property: "visible"
              value: true
              timeout: 15000
            - name: "Set the wallet's birthday"
              action: call_method
              find_value: "setBirthdayButton"
              method: "clicked"
              args: []
            - name: "The birthday sheet opens"
              action: expect_property
              find_value: "birthdaySheet"
              property: "opened"
              value: true
              timeout: 10000
            - name: "A day after the wallet's first payment"
              action: set_text
              find_by: "objectName"
              find_value: "birthdayDateField"
              value: "2026-07-01"
            - name: "Set it"
              action: call_method
              find_value: "confirmBirthdayButton"
              method: "clicked"
              args: []
            - name: "The core refuses it, and the sheet says why"
              action: expect_property
              find_value: "birthdayError"
              property: "text"
              value: "Not set: the wallet has a transaction from before 2026-07-01, at height 290023"
              timeout: 15000
              screenshot: "wallet-birthday-refused.png"
            - name: "I don't know"
              action: set_property
              find_by: "objectName"
              find_value: "birthdayUnknown"
              property: "checked"
              value: true
            - name: "Set that"
              action: call_method
              find_value: "confirmBirthdayButton"
              method: "clicked"
              args: []
            - name: "The sheet closes"
              action: expect_property
              find_value: "birthdaySheet"
              property: "visible"
              value: false
              timeout: 15000
            - name: "It rescans from where its kind of address began; a server's full scan has no share to show"
              action: expect_property
              find_value: "rescanLine"
              property: "text"
              value: "Rescanning from block 0…"
              timeout: 10000
              screenshot: "wallet-rescanning.png"
            - name: "The rescan ends"
              action: expect_property
              find_value: "rescanPane"
              property: "visible"
              value: false
              timeout: 15000
            - name: "...and nobody asks for a birthday any more"
              action: expect_property
              find_value: "needsBirthdayHomeNotice"
              property: "visible"
              value: false
              timeout: 5000
            - name: "The confirmed balance"
              action: expect_property
              find_value: "confirmedCard"
              property: "value"
              value: "1.25 BTC"
              timeout: 15000
            - name: "Payments waiting for the wallet's chain"
              action: expect_property
              find_value: "waitingRowAmount"
              property: "text"
              value: "0.0005 BTC"
              timeout: 10000
            - name: "A pending payment, with the source that reported it"
              action: expect_property
              find_value: "pendingRowAmount"
              property: "text"
              value: "0.0003 BTC"
              timeout: 10000
            - name: "Coins too small to spend at today's fee rate"
              action: expect_property
              find_value: "tooSmallRowAmount"
              property: "text"
              value: "2 coins, 0.0000054 BTC"
              timeout: 10000
              screenshot: "wallet-home.png"

            - name: "A coin found beyond the 20-address gap limit: a line of its own, apart from the balance"
              action: expect_property
              find_value: "beyondGapRow"
              property: "title"
              value: "Found beyond your 20-address gap limit"
              timeout: 10000
            - name: "...0.0007 BTC"
              action: expect_property
              find_value: "beyondGapRowAmount"
              property: "text"
              value: "0.0007 BTC"
            - name: "...spendable"
              action: expect_property
              find_value: "beyondGapRow"
              property: "note"
              value: "1 coin, yours and spendable: Send counts them."
            - name: "...and what it means"
              action: expect_property
              find_value: "beyondGapRowInfo"
              property: "text"
              value: "These coins are yours, and you can spend them. Other wallets that use a gap limit of 20 won't show them. Raising the gap limit in Settings makes them part of the normal balance."
              screenshot: "wallet-beyond-gap.png"
            - name: "Activity, for the coin's row"
              action: call_method
              find_value: "bitcoinWalletRoot"
              method: "selectTab"
              args: [3]
            - name: "Its row carries a quiet label"
              action: expect_property
              find_value: "historyBeyondGap_0bea0000000111700bea0000000111700bea0000000111700bea000000011170"
              property: "text"
              value: "Beyond the gap limit"
              timeout: 10000
            - name: "...shown"
              action: expect_property
              find_value: "historyBeyondGap_0bea0000000111700bea0000000111700bea0000000111700bea000000011170"
              property: "visible"
              value: true
              screenshot: "wallet-beyond-gap-row.png"

            - name: "Go to Receive"
              action: call_method
              find_value: "bitcoinWalletRoot"
              method: "selectTab"
              args: [2]
            - name: "A fresh address, with its BIP21 QR drawn as rectangles"
              action: expect_property
              find_value: "receiveQr"
              property: "visible"
              value: true
              timeout: 15000
            - name: "...the wallet's first"
              action: expect_property
              find_value: "receiveAddress"
              property: "text"
              value: "tb1qw4aq6uwu07jxg44l4lhqtmjj8j8ncd4qpmpm3r"
              timeout: 10000
            - name: "Ask for another"
              action: click_object
              find_value: "newAddressButton"
            - name: "A new one"
              action: expect_property
              find_value: "receiveAddress"
              property: "text"
              value: "tb1qmyt0kg3tn9edlzmqd365whe98wq4jln56mwgjs"
              timeout: 10000
            - name: "Ask for an amount"
              action: set_text
              find_by: "objectName"
              find_value: "receiveAmountField"
              value: "0.0015"
            - name: "The payment request carries it"
              action: expect_property
              find_value: "receiveUri"
              property: "text"
              value: "bitcoin:tb1qmyt0kg3tn9edlzmqd365whe98wq4jln56mwgjs?amount=0.0015"
              timeout: 10000
              screenshot: "wallet-receive.png"

            - name: "Go to Send"
              action: call_method
              find_value: "bitcoinWalletRoot"
              method: "selectTab"
              args: [1]
            - name: "Pay a signet address"
              action: set_text
              find_by: "objectName"
              find_value: "sendRecipientField"
              value: "tb1qw508d6qejxtdg4y5r3zarvary0c5xw7kxpjzsx"
            - name: "0.0003 BTC, which nobody acknowledges in time"
              action: set_text
              find_by: "objectName"
              find_value: "sendAmountField"
              value: "0.0003"
            - name: "The address checks out as typed"
              action: expect_property
              find_value: "recipientBadge"
              property: "text"
              value: "native segwit"
              timeout: 10000
            - name: "Review is enabled"
              action: expect_property
              find_value: "reviewButton"
              property: "enabled"
              value: true
              timeout: 10000
            - name: "Review"
              action: click_object
              find_value: "reviewButton"
            - name: "The review opens"
              action: expect_property
              find_value: "reviewSheet"
              property: "opened"
              value: true
              timeout: 10000
            - name: "It shows the amount"
              action: expect_property
              find_value: "draftAmount"
              property: "text"
              value: "0.0003 BTC (30,000 sats)"
              timeout: 5000
              screenshot: "wallet-review.png"
            - name: "Approve in Signer"
              action: click_object
              find_value: "approveInSignerButton"
            - name: "The wallet built it and asks the signer app"
              action: expect_property
              find_value: "sendHeadline"
              property: "text"
              value: "Approve it in the signer app"
