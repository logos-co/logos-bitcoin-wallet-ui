              method: "selectTab"
              args: [0]
            - name: "Dismiss it"
              action: call_method
              find_value: "dismissAuthorityAlertButton"
              method: "clicked"
              args: []
            - name: "It is gone"
              action: expect_property
              find_value: "authoritySuspectBanner"
              property: "visible"
              value: false
              timeout: 10000
            - name: "Close the wallet"
              action: click_object
              find_value: "closeWalletButton"
            - name: "It is closing"
              action: expect_property
              find_value: "bitcoinWalletRoot"
              property: "walletState"
              value: "closing"
              timeout: 5000
            - name: "While it closes, pick testnet4"
              action: call_method
              find_value: "bitcoinWalletRoot"
              method: "selectNetwork"
              args: ["testnet4"]
            - name: "The switch waits for the close"
              action: expect_property
              find_value: "switchNote"
              property: "text"
              value: "Switching to testnet4 when the wallet has closed"
              timeout: 5000
              screenshot: "wallet-switch-pending.png"
            - name: "The wallet has closed"
              action: expect_property
              find_value: "openWalletButton"
              property: "enabled"
              value: true
              timeout: 20000
            - name: "Open a wallet before the switch has applied"
              action: call_method
              find_value: "openWalletButton"
              method: "clicked"
              args: []
            - name: "The app asks to wait for the switch"
              action: expect_property
              find_value: "errorNotice"
              property: "message"
              value: "Wait for the network switch to finish."
              timeout: 5000
              screenshot: "wallet-open-refused-mid-switch.png"
            - name: "The switch applied: testnet4"
              action: expect_property
              find_value: "networkChip"
              property: "text"
              value: "testnet4"
              timeout: 20000
            - name: "Dismiss the notice"
              action: set_property
              find_value: "errorNotice"
              property: "shown"
              value: false
            - name: "Open, on testnet4"
              action: click_object
              find_value: "openWalletButton"
            - name: "The wallet opens there"
              action: expect_property
              find_value: "bitcoinWalletRoot"
              property: "walletState"
              value: "ready"
              timeout: 30000
            - name: "...not on the old network"
              action: expect_property
              find_value: "bitcoinWalletRoot"
              property: "displayedNetwork"
              value: "testnet4"
            - name: "Receive on testnet4, where an older app's opens left 20 unused addresses"
              action: call_method
              find_value: "bitcoinWalletRoot"
              method: "selectTab"
              args: [2]
            - name: "It shows the first of them"
              action: expect_property
              find_value: "receiveAddress"
              property: "text"
              value: "tb1qw4aq6uwu07jxg44l4lhqtmjj8j8ncd4qpmpm3r"
              timeout: 10000
            - name: "Ask for another"
              action: click_object
              find_value: "newAddressButton"
            - name: "None past the gap limit: the app says why, and what to do"
              action: expect_property
              find_value: "receiveGapNote"
              property: "text"
              value: "You already have 20 unused addresses. This one is shown until one receives coins; raise the gap limit in Settings for more."
              timeout: 10000
              screenshot: "wallet-receive-gap.png"
            - name: "...and keeps showing the first unused one"
              action: expect_property
              find_value: "receiveAddress"
              property: "text"
              value: "tb1qw4aq6uwu07jxg44l4lhqtmjj8j8ncd4qpmpm3r"
            - name: "Send on testnet4, where Kyoto estimates no fee"
              action: call_method
              find_value: "bitcoinWalletRoot"
              method: "selectTab"
              args: [1]
            - name: "No estimate yet: the app says so"
              action: expect_property
              find_value: "feeUnknownNote"
              property: "text"
              value: "Fee estimate not available yet. Give a rate of your own, in sat/vB."
              timeout: 15000
              screenshot: "wallet-fees-unknown.png"
            - name: "...and offers no preset in its place"
              action: expect_property
              find_value: "feeNormal"
              property: "visible"
              value: false
            - name: "On testnet4 Kyoto runs on its one curated peer"
              action: call_method
              find_value: "bitcoinWalletRoot"
              method: "selectTab"
              args: [4]
            - name: "One peer decides this wallet's chain, and the sources say so"
              action: expect_property
              find_value: "oneOperatorNotice"
              property: "title"
              value: "One peer decides this wallet's chain"
              timeout: 15000
              screenshot: "wallet-one-peer.png"
            - name: "Close it for good"
              action: click_object
              find_value: "closeWalletButton"
            - name: "Closed"
              action: expect_property
              find_value: "bitcoinWalletRoot"
              property: "walletState"
              value: "no_wallet"
              timeout: 20000

            # A Keycard account with no card inserted: the picker names its seed wallet, and it opens
            # to view, since only signing needs the card.
            - name: "Pick the Keycard account"
              action: set_property
              find_value: "accountPicker"
              property: "currentIndex"
              value: 1
            - name: "...as a person choosing it would"
              action: call_method
              find_value: "accountPicker"
              method: "activated"
              args: [1]
            - name: "It is selected"
              action: expect_property
              find_value: "bitcoinWalletRoot"
              property: "selectedAccountId"
              value: "g_fixture_card"
              timeout: 5000
            - name: "Named by its seed wallet, not by a module"
              action: expect_property
              find_value: "selectedAccountProvider"
              property: "text"
              value: "Keycard · Black Card"
            - name: "...and not connected"
              action: expect_property
              find_value: "selectedAccountDetail"
              property: "text"
              value: "Native segwit · Keycard not connected"
            - name: "What works without the card"
              action: expect_property
              find_value: "deviceAbsentNote"
              property: "text"
              value: "Keycard not connected · you can view this wallet; sending needs the device"
            - name: "...and what signing needs"
              action: expect_property
              find_value: "deviceReasonLine"
              property: "text"
              value: "Insert Black Card in a reader or connect a Keycard Shell to sign"
            - name: "Open is enabled"
              action: expect_property
              find_value: "openWalletButton"
              property: "enabled"
              value: true
              timeout: 5000
              screenshot: "wallet-keycard-not-connected.png"
            - name: "Open it"
              action: click_object
              find_value: "openWalletButton"
            - name: "It opens without the card"
              action: expect_property
              find_value: "bitcoinWalletRoot"
              property: "walletOpen"
              value: true
              timeout: 30000
            - name: "...as the Keycard account"
              action: expect_property
              find_value: "statusLine"
              property: "text"
              value: "Open: Card account · testnet4"
              timeout: 10000
            - name: "Send"
              action: call_method
              find_value: "bitcoinWalletRoot"
              method: "selectTab"
              args: [1]
            - name: "Send says what signing needs"
              action: expect_property
              find_value: "sendDeviceNote"
              property: "text"
              value: "Keycard not connected. Insert Black Card in a reader or connect a Keycard Shell to sign. You can view this wallet; sending needs it."
              timeout: 5000
              screenshot: "wallet-keycard-send.png"
            - name: "Settings, to close"
              action: call_method
              find_value: "bitcoinWalletRoot"
              method: "selectTab"
              args: [4]
            - name: "Close it"
              action: click_object
              find_value: "closeWalletButton"
            - name: "No wallet is open"
              action: expect_property
              find_value: "bitcoinWalletRoot"
              property: "walletState"
              value: "no_wallet"
              timeout: 20000
